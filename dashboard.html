<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Clinic - Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .dashboard-header {
      padding: 22px 7%;
      background-color: #167c78;
      color: #ffffff;
    }

    .dashboard-header h1 {
      margin-bottom: 5px;
      color: #ffffff;
      font-size: 27px;
    }

    .dashboard-header p {
      color: #d9f1ef;
    }

    .dashboard-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 14px 7%;
      background-color: #ffffff;
      box-shadow: 0 2px 8px rgba(25, 73, 72, 0.1);
    }

    .dashboard-nav a {
      padding: 8px 12px;
      border-radius: 5px;
      color: #31545a;
      font-weight: bold;
      text-decoration: none;
    }

    .dashboard-nav a:hover {
      background-color: #e1f2f0;
      color: #116964;
    }

    .dashboard-main {
      width: 86%;
      max-width: 1100px;
      margin: 38px auto;
    }

    .dashboard-main h2 {
      margin-bottom: 20px;
      color: #173f46;
    }

    .dashboard-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .dashboard-card {
      padding: 24px;
      border-left: 5px solid #167c78;
      border-radius: 8px;
      background-color: #ffffff;
      box-shadow: 0 5px 16px rgba(25, 73, 72, 0.08);
    }

    .dashboard-card h3 {
      margin-bottom: 13px;
      color: #597076;
      font-size: 15px;
    }

    .dashboard-number {
      color: #173f46;
      font-size: 32px;
      font-weight: bold;
    }

    @media (max-width: 800px) {
      .dashboard-cards {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
      .dashboard-cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="dashboard-header">
    <h1>Smart Clinic Dashboard</h1>
    <p>Daily clinic overview</p>
  </header>

  <nav class="dashboard-nav" aria-label="Main navigation">
    <a href="patients.html">Patients</a>
    <a href="appointments.html">Appointments</a>
    <a href="clinic.html">Clinic</a>
  </nav>

  <main class="dashboard-main">
    <h2>Clinic Summary</h2>

    <section class="dashboard-cards" aria-label="Clinic summary counts">
      <article class="dashboard-card">
        <h3>Total Patients</h3>
        <p id="totalPatients" class="dashboard-number">0</p>
      </article>

      <article class="dashboard-card">
        <h3>Appointments</h3>
        <p id="totalAppointments" class="dashboard-number">0</p>
      </article>

      <article class="dashboard-card">
        <h3>Doctors</h3>
        <p id="totalDoctors" class="dashboard-number">0</p>
      </article>

      <article class="dashboard-card">
        <h3>Medicines</h3>
        <p id="totalMedicines" class="dashboard-number">0</p>
      </article>
    </section>
  </main>

  <script src="js/dashboard.js"></script>
</body>
</html>
